name: Deploy Supabase

on:
  push:
    branches: [claude/new-session-x4vojn]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Versão fixa do Supabase CLI ("latest" já quebrou o deploy duas
          # vezes: rate limit da API do GitHub ao resolver a versão e a
          # mudança que passou a exigir --yes no db push).
          # Para atualizar: escolha uma versão estável em
          # https://github.com/supabase/cli/releases (ou `npm view supabase
          # dist-tags`), confira com `npx supabase@<versão> db push --help` que
          # o --yes continua aceito, troque aqui e acompanhe o próximo deploy.
          # No CLI 3.x o "db push" mira o banco LOCAL por padrão e --db-url
          # virou alias (oculto) de --remote=<url>: se um dia o alias sair,
          # troque o passo abaixo por `--remote="$SUPABASE_DB_URL"`.
          version: 3.2.0
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase db push --yes --db-url ${{ secrets.SUPABASE_DB_URL }}
